name: Vérification des secrets
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/check-secrets.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tester les clés (sans afficher leur valeur)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ok(){ echo "✅ $1"; }; ko(){ echo "❌ $1"; FAIL=1; }
          for v in ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID PIXABAY_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            [ -n "${!v}" ] && ok "$v présent" || echo "⚠️  $v absent"
          done
          c=$(curl -s -o /tmp/v.mp3 -w '%{http_code}' -X POST -H "xi-api-key: $ELEVENLABS_API_KEY" -H "Content-Type: application/json" -d '{"text":"Hi.","model_id":"eleven_flash_v2_5"}' "https://api.elevenlabs.io/v1/text-to-speech/$ELEVENLABS_VOICE_ID")
          [ "$c" = 200 ] && ok "ElevenLabs : clé + voix OK, synthèse test de $(stat -c%s /tmp/v.mp3) octets" || ko "ElevenLabs synthèse : HTTP $c ($(jq -r '.detail.status // .detail.message // empty' /tmp/v.mp3 2>/dev/null))"
          c=$(curl -s -o /tmp/u.json -w '%{http_code}' -H "xi-api-key: $ELEVENLABS_API_KEY" "https://api.elevenlabs.io/v1/user/subscription")
          [ "$c" = 200 ] && ok "ElevenLabs : forfait $(jq -r '.tier' /tmp/u.json), $(jq -r '.character_count' /tmp/u.json)/$(jq -r '.character_limit' /tmp/u.json) crédits utilisés" || echo "ℹ️  ElevenLabs abonnement non lisible (HTTP $c, droit user_read absent : sans gravité)"
          c=$(curl -s -o /tmp/p.json -w '%{http_code}' "https://pixabay.com/api/?key=$PIXABAY_API_KEY&q=cast+iron+pan&image_type=photo&per_page=3")
          [ "$c" = 200 ] && ok "Pixabay : clé valide, $(jq -r '.totalHits' /tmp/p.json) photos pour « cast iron pan »" || ko "Pixabay : HTTP $c"
          [[ "$YT_CLIENT_ID" == 31074457817-k25ucn9e3i8praiui6ppi1q6ge0im4mj.apps.googleusercontent.com ]] && ok "YT_CLIENT_ID = client WikiTube" || ko "YT_CLIENT_ID ne correspond pas au client wikitube-tube (fin : ${YT_CLIENT_ID: -30})"
          [[ "$YT_CLIENT_SECRET" == GOCSPX-* ]] && ok "YT_CLIENT_SECRET au bon format" || ko "YT_CLIENT_SECRET : format inattendu"
          if [ -n "$YT_REFRESH_TOKEN" ]; then
            c=$(curl -s -o /tmp/t.json -w '%{http_code}' -X POST https://oauth2.googleapis.com/token -d client_id="$YT_CLIENT_ID" -d client_secret="$YT_CLIENT_SECRET" -d refresh_token="$YT_REFRESH_TOKEN" -d grant_type=refresh_token)
            if [ "$c" = 200 ]; then
              AT=$(jq -r .access_token /tmp/t.json); echo "::add-mask::$AT"
              ch=$(curl -s -H "Authorization: Bearer $AT" "https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true" | jq -r '.items[0] | "\(.snippet.title) (\(.id))"')
              [[ "$ch" == *UCiONfy96noLe4mRkVYtNRGg* ]] && ok "YouTube : jeton valide pour $ch" || ko "YouTube : jeton valide mais chaîne = $ch (attendu WikiTUBE UCiONfy96noLe4mRkVYtNRGg)"
            else
              ko "YouTube : échange du jeton HTTP $c ($(jq -r '.error' /tmp/t.json))"
            fi
          else
            echo "⏳ YT_REFRESH_TOKEN pas encore posé (client ID/secret vérifiés à la prochaine étape)"
            c=$(curl -s -o /tmp/t.json -w '%{http_code}' -X POST https://oauth2.googleapis.com/token -d client_id="$YT_CLIENT_ID" -d client_secret="$YT_CLIENT_SECRET" -d refresh_token=invalide -d grant_type=refresh_token)
            e=$(jq -r .error /tmp/t.json)
            [ "$e" = invalid_grant ] && ok "Couple YT_CLIENT_ID / YT_CLIENT_SECRET accepté par Google" || ko "Couple client ID / secret refusé par Google ($e)"
          fi
          [ -z "$FAIL" ]
